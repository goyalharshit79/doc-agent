<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="nodeGoldIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A07848"/>
      <stop offset="100%" stop-color="#C49A5A"/>
    </linearGradient>
  </defs>

  <!-- Cream background square with rounded corners -->
  <rect width="64" height="64" rx="14" fill="#F5F0E6"/>

  <!-- Document path — centred in 64x64 -->
  <path d="M 12,8 L 38,8 L 52,22 L 52,58 L 12,58 Z"
        fill="#EDEAE2" stroke="#2C2820" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Fold -->
  <path d="M 38,8 L 52,22 L 38,22 Z"
        fill="#DED7C8" stroke="#2C2820" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Lines -->
  <line x1="20" y1="32" x2="44" y2="32" stroke="#B8B0A4" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="20" y1="41" x2="41" y2="41" stroke="#B8B0A4" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="20" y1="50" x2="36" y2="50" stroke="#B8B0A4" stroke-width="1.8" stroke-linecap="round"/>

  <!-- AI nodes -->
  <circle cx="20" cy="32" r="3.5" fill="url(#nodeGoldIcon)"/>
  <circle cx="20" cy="41" r="3.5" fill="url(#nodeGoldIcon)"/>
  <circle cx="20" cy="50" r="3.5" fill="url(#nodeGoldIcon)"/>

  <!-- Subtle connector -->
  <line x1="20" y1="32" x2="20" y2="50"
        stroke="#B8945A" stroke-width="0.9" opacity="0.4" stroke-dasharray="2 2.5"/>

  <!-- AI spark at fold corner -->
  <g transform="translate(46, 16)">
    <line x1="0" y1="-4.5" x2="0" y2="4.5" stroke="#B8945A" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-4.5" y1="0" x2="4.5" y2="0" stroke="#B8945A" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-3" y1="-3" x2="3" y2="3" stroke="#B8945A" stroke-width="0.8" stroke-linecap="round" opacity="0.55"/>
    <line x1="3" y1="-3" x2="-3" y2="3" stroke="#B8945A" stroke-width="0.8" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
